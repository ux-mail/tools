<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massive 2FA v52.0 (Sheets Master)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.2/otpauth.umd.min.js"></script>
    <style>
        :root { --primary: #06b6d4; --bg: #0a0a0a; --card: #161616; --border: #262626; --text: #e5e5e5; --gray: #737373; --success: #10b981; --danger: #ef4444; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 0; margin: 0; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 850px; padding: 15px; box-sizing: border-box; }
        
        .glass-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        textarea { width: 100%; height: 140px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #22c55e; font-family: monospace; outline: none; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 15px; text-transform: uppercase; }

        .sticky-nav { position: sticky; top: 0; background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); padding: 10px 0; z-index: 100; border-bottom: 1px solid var(--border); display: none; }
        .search-bar { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: #fff; outline: none; box-sizing: border-box; }

        /* LIST ROW */
        .acc-row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: grid; grid-template-columns: 25px 1fr auto; gap: 12px; align-items: center; transition: 0.2s; }
        .acc-row.checked { opacity: 0.3; background: #000; border-style: dashed; }
        
        .acc-no { font-size: 10px; color: var(--gray); text-align: center; font-weight: bold; }
        .acc-info { display: flex; flex-direction: column; overflow: hidden; }
        .acc-mail { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 500; user-select: none; }
        .acc-sub-info { font-size: 10px; color: var(--gray); font-family: monospace; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; user-select: none; }
        
        .action-group { display: flex; align-items: center; gap: 5px; }
        .otp-display { font-family: monospace; font-size: 18px; font-weight: 800; color: var(--primary); min-width: 65px; text-align: center; }
        
        .btn-small { padding: 8px 6px; border-radius: 6px; border: 1px solid #333; background: #262626; color: #fff; font-size: 9px; font-weight: 800; cursor: pointer; text-transform: uppercase; min-width: 42px; }
        .btn-otp { background: var(--primary); color: #000; border: none; }
        .btn-check.is-done { background: var(--success); color: #000; border-color: var(--success); }

        @media (max-width: 600px) {
            .acc-mail { font-size: 12px; }
            .otp-display { font-size: 16px; min-width: 60px; }
            .btn-small { padding: 7px 4px; font-size: 8px; min-width: 38px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="glass-card" id="inputSection">
        <h3 style="margin:0 0 10px 0; color:var(--primary)">Massive 2FA v52.0</h3>
        <textarea id="inputData" placeholder="Blok & copy Kolom Email, Key, dan Sandi langsung dari Sheet, lalu paste di sini..."></textarea>
        <button class="btn-main" onclick="initApp()">Load & Save Data</button>
    </div>

    <div id="stickyNav" class="sticky-nav">
        <input type="text" id="search" class="search-bar" placeholder="🔍 Cari email atau nomor...">
    </div>

    <div id="appBody" style="display:none">
        <div style="display: flex; justify-content: space-between; padding: 10px; font-size: 11px; color: var(--gray);">
            <span>TOTAL: <b id="totalAcc" style="color:var(--primary)">0</b></span>
            <span>REFRESH: <b id="timer" style="color:var(--success)">30s</b></span>
            <button onclick="clearStorage()" style="color:var(--danger); background:none; border:none; cursor:pointer; font-size:10px;">RESET ALL</button>
        </div>
        <div id="list"></div>
    </div>
</div>

<script>
    let db = [];

    window.onload = function() {
        const saved = localStorage.getItem('massive_2fa_v52');
        if (saved) { db = JSON.parse(saved); showApp(); }
    };

    function initApp() {
        const raw = document.getElementById('inputData').value.trim();
        if(!raw) return alert("Paste data dari Sheet!");
        
        const lines = raw.split('\n');
        db = [];
        
        lines.forEach(line => {
            if (line.trim() === "") return;
            
            // Pemisah Tab (\t) otomatis mendeteksi struktur kolom Google Sheets / Excel
            let parts = line.split('\t');

            if (parts.length >= 2) {
                const email = parts[0].trim();
                const key = parts[1].trim().replace(/\s/g, '').toUpperCase();
                // Ambil kolom ke-3 jika ada, jika kosong berikan teks default kosong
                const password = parts[2] ? parts[2].trim() : ''; 
                
                if (email && key) {
                    db.push({ email: email, key: key, password: password, done: false });
                }
            }
        });

        if (db.length === 0) {
            return alert("Format data tidak sesuai. Pastikan Anda menyalin kolom dari spreadsheet langsung.");
        }

        saveToBrowser(); showApp();
    }

    function showApp() {
        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('stickyNav').style.display = 'block';
        document.getElementById('appBody').style.display = 'block';
        document.getElementById('totalAcc').innerText = db.length;
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const listEl = document.getElementById('list');
        listEl.innerHTML = '';

        db.forEach((acc, index) => {
            if (acc.email.toLowerCase().includes(query) || (index+1).toString() === query) {
                const row = document.createElement('div');
                row.className = `acc-row ${acc.done ? 'checked' : ''}`;
                row.innerHTML = `
                    <div class="acc-no">${index+1}</div>
                    <div class="acc-info">
                        <div class="acc-mail">${acc.email}</div>
                        <div class="acc-sub-info">KEY: ${acc.key} ${acc.password ? '• PASS: ' + acc.password : ''}</div>
                    </div>
                    <div class="action-group">
                        <button class="btn-small" onclick="copyValue('${acc.email}', this, 'MAIL')">MAIL</button>
                        <button class="btn-small" onclick="copyValue('${acc.key}', this, 'KEY')">KEY</button>
                        ${acc.password ? `<button class="btn-small" style="background:#3b82f6;" onclick="copyValue('${acc.password}', this, 'PASS')">PASS</button>` : ''}
                        <div class="otp-display" id="otp-${index}">------</div>
                        <button class="btn-small btn-otp" onclick="copyOTP(${index}, this)">OTP</button>
                        <button class="btn-small btn-check ${acc.done ? 'is-done' : ''}" onclick="toggleDone(${index})">${acc.done ? '✓' : 'Check'}</button>
                    </div>
                `;
                listEl.appendChild(row);
            }
        });
        updateCodes();
    }

    function saveToBrowser() { localStorage.setItem('massive_2fa_v52', JSON.stringify(db)); }
    function toggleDone(index) { db[index].done = !db[index].done; saveToBrowser(); render(); }
    function clearStorage() { if(confirm("Hapus semua?")) { localStorage.removeItem('massive_2fa_v52'); location.reload(); } }

    function copyValue(txt, btn, originalLabel) {
        navigator.clipboard.writeText(txt).then(() => {
            btn.innerText = "OK";
            setTimeout(() => { btn.innerText = originalLabel; }, 800);
        }).catch(() => {
            const el = document.createElement('textarea'); el.value = txt;
            document.body.appendChild(el); el.select(); document.execCommand('copy');
            document.body.removeChild(el);
            btn.innerText = "OK";
            setTimeout(() => { btn.innerText = originalLabel; }, 800);
        });
    }

    function copyOTP(index, btn) {
        const code = document.getElementById('otp-' + index).innerText;
        if(code === "------" || code === "ERR") return;
        
        navigator.clipboard.writeText(code).then(() => {
            const ori = btn.innerText; btn.innerText = "OK"; btn.style.background = "#fff";
            setTimeout(() => { btn.innerText = ori; btn.style.background = "var(--primary)"; }, 800);
        }).catch(() => {
            const el = document.createElement('textarea'); el.value = code;
            document.body.appendChild(el); el.select(); document.execCommand('copy');
            document.body.removeChild(el);
            const ori = btn.innerText; btn.innerText = "OK"; btn.style.background = "#fff";
            setTimeout(() => { btn.innerText = ori; btn.style.background = "var(--primary)"; }, 800);
        });
    }

    function updateCodes() {
        if(db.length === 0) return;
        const remain = 30 - (Math.floor(Date.now() / 1000) % 30);
        const tEl = document.getElementById('timer'); if(tEl) tEl.innerText = remain + "s";
        db.forEach((acc, index) => {
            const el = document.getElementById('otp-' + index);
            if(el) {
                try {
                    let totp = new OTPAuth.TOTP({ secret: acc.key });
                    el.innerText = totp.generate();
                } catch(e) { el.innerText = "ERR"; }
            }
        });
    }

    setInterval(updateCodes, 1000);
    document.getElementById('search').oninput = render;
</script>

</body>
</html>
